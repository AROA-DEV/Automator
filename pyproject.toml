[tool.poetry]
name = "automator"
version = "1.0.0"
description = "System automation and configuration tool for Linux distributions"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "automator"}]

[tool.poetry.dependencies]
python = "^3.8"
rich = "^13.0.0"
requests = "^2.31.0"
netifaces = "^0.11.0"
pyyaml = "^6.0.1"
ipaddress = "^1.0.23"
pathlib = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
flake8 = "^6.1.0"
mypy = "^1.5.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
automator = "automator.Automator:main"

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
